name: kite
description: >-
  A developer-friendly Flutter devpack with a modern design system,
  reusable UI components, utilities, and application foundations.
version: 1.0.0

homepage: https://github.com/orkitt/kite_ui
repository: https://github.com/orkitt/kite_ui
issue_tracker: https://github.com/orkitt/kite_ui/issues
documentation: https://github.com/orkitt/kite_ui#readme

topics:
  - flutter
  - design-system
  - ui-components
  - developer-tools
  - widgets

environment:
  sdk: ^3.12.2
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

screenshots:
  - description: Kite — Flutter Complete Devpack
    path: images/icon.png

flutter:
  uses-material-design: true
