name: Flutter Template Smoke Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  generated-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub get
      - run: flutter create /tmp/kite_smoke
      - run: dart run bin/kite.dart init --path /tmp/kite_smoke --force
      - run: dart run bin/kite.dart feature dashboard --path /tmp/kite_smoke --clean --route
      - run: dart run bin/kite.dart feature profile --path /tmp/kite_smoke --mvc --route
      - run: dart run bin/kite.dart component button card avatar --path /tmp/kite_smoke
      - run: dart run bin/kite.dart state riverpod --path /tmp/kite_smoke
      - run: dart run bin/kite.dart api dio --path /tmp/kite_smoke
      - run: flutter analyze
        working-directory: /tmp/kite_smoke
